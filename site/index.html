<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#06111b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LOKY PC4">
  <meta name="format-detection" content="telephone=no">
  <title>LOKY PC4 Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./mobile.css?v=0.3.3">
</head>
<body>
  <main id="app" class="app-shell" aria-label="LOKY PC4 Mobile iOS">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>LOKY PC4</span>
      </div>
      <div id="status" class="status" aria-live="polite">READY</div>
    </header>

    <section class="stage" aria-label="Esfera LOKY">
      <div class="cosmic-background" aria-hidden="true">
        <div class="nebula"></div>
        <div class="stars"></div>
        <div class="stars soft"></div>
      </div>
      <div class="sphere-wrap">
        <canvas id="lokySphere" aria-label="Esfera de partículas LOKY PC4"></canvas>
        <div class="orbital-ring ring-a" aria-hidden="true"></div>
        <div class="orbital-ring ring-b" aria-hidden="true"></div>
      </div>
      <div id="fallback" class="fallback hidden" role="status">GPU visual no disponible.</div>
    </section>

    <section class="mobile-controls" aria-label="Controles LOKY">
      <div class="voice-state" aria-live="polite">
        <strong id="conversationState">LISTO</strong>
        <span id="conversationHint">Toca el micrófono para hablar</span>
        <span id="liveBadge" class="live-badge">ACTIVACIÓN REQUERIDA</span>
      </div>

      <div id="activationPanel" class="activation-panel">
        <input id="pairCode" class="pair-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CÓDIGO OWNER" aria-label="Código Owner">
        <button id="activateButton" class="activate-button" type="button">ACTIVAR</button>
      </div>

      <nav class="action-dock" aria-label="Acciones rápidas">
        <span class="dock-slot dock-slot-reserved" aria-hidden="true"></span>
        <span class="dock-slot dock-slot-reserved" aria-hidden="true"></span>
        <button id="talkButton" class="talk-button sismos-action hidden" type="button" data-active="0" aria-label="Hablar con LOKY">HABLAR CON LOKY</button>
        <span class="dock-slot dock-slot-reserved" aria-hidden="true"></span>
        <span class="dock-slot dock-slot-reserved" aria-hidden="true"></span>
      </nav>

      <div class="transcript-data" aria-live="polite" aria-hidden="true">
        <p id="userTranscript">—</p>
        <p id="lokyTranscript">—</p>
      </div>
    </section>

    <footer class="footer">
      <span id="buildLabel">iOS 0.3.3 · CLEAN DOCK UI</span>
      <button id="updateButton" class="update-button hidden" type="button">ACTUALIZAR</button>
    </footer>
  </main>

  <script src="./sphere-mobile.js"></script>
  <script src="./app.js?v=0.3.3"></script>
  <script src="./live-mobile.js?v=0.3.2"></script>
  <script src="./ios-audio-stability.js?v=0.3.2"></script>
</body>
</html>
