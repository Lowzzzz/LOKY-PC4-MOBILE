<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#06111b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LOKY PC4">
  <meta name="format-detection" content="telephone=no">
  <title>LOKY PC4 Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <main id="app" class="app-shell" aria-label="LOKY PC4 Mobile iOS">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>LOKY PC4</span>
      </div>
      <div id="status" class="status" aria-live="polite">READY</div>
    </header>

    <section class="stage" aria-label="Esfera LOKY">
      <div class="cosmic-background" aria-hidden="true">
        <div class="nebula"></div>
        <div class="stars"></div>
        <div class="stars soft"></div>
      </div>
      <div class="sphere-wrap">
        <canvas id="lokySphere" aria-label="Esfera de partículas LOKY PC4"></canvas>
        <div class="orbital-ring ring-a" aria-hidden="true"></div>
        <div class="orbital-ring ring-b" aria-hidden="true"></div>
      </div>
      <div id="fallback" class="fallback hidden" role="status">
        GPU visual no disponible.
      </div>
    </section>

    <section class="conversation-shell" aria-label="Conversación LOKY">
      <div class="conversation-copy">
        <span class="conversation-kicker">LOKY</span>
        <strong id="conversationState">LISTO</strong>
        <span id="conversationHint">Interfaz preparada para Gemini Live</span>
      </div>
      <button id="infoButton" class="info-button" type="button" aria-expanded="false" aria-controls="statusSheet">
        ESTADO
      </button>
    </section>

    <footer class="footer">
      <span id="buildLabel">iOS 0.2.0 · UI SHELL</span>
      <button id="updateButton" class="update-button hidden" type="button">ACTUALIZAR</button>
    </footer>

    <aside id="statusSheet" class="status-sheet hidden" aria-label="Estado de LOKY PC4 Mobile">
      <button id="closeSheet" class="sheet-close" type="button" aria-label="Cerrar">×</button>
      <div class="sheet-title">LOKY PC4 MOBILE</div>
      <div class="sheet-row"><span>Visual</span><strong>SPHERE 15K</strong></div>
      <div class="sheet-row"><span>Cloud</span><strong>GITHUB PAGES</strong></div>
      <div class="sheet-row"><span>Versión</span><strong>iOS 0.2.0</strong></div>
      <div class="sheet-row"><span>Conversación</span><strong>FASE 0.3</strong></div>
    </aside>
    <div id="sheetBackdrop" class="sheet-backdrop hidden" aria-hidden="true"></div>
  </main>

  <script src="./sphere-mobile.js"></script>
  <script src="./app.js"></script>
</body>
</html>
