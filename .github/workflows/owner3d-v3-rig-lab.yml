name: Owner3D V3 Fullbody Face Lab

on:
  push:
    branches: [work/owner3d-v3-fullbody-face]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner3d-v3-fullbody-face
  cancel-in-progress: true

jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct clean R8R13 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v3-rig-output
          python3 - <<'PY'
          from pathlib import Path
          import base64,struct,hashlib
          raw=base64.b64decode("".join(Path(f"site/assets/owner3d/chunk_{i:03d}.txt").read_text().strip() for i in range(13)),validate=True)
          magic,ver,total=struct.unpack_from("<4sII",raw,0)
          assert magic==b"glTF" and ver==2 and total==len(raw)==8536252
          assert hashlib.sha256(raw).hexdigest()=="852f70b8c437c1b43dfa5b816e3bc79de597135f059c0dfc9d1821b24ed45d84"
          Path("v3-rig-output/source.glb").write_bytes(raw)
          PY
      - name: Install Blender 4.5.14 LTS and QA libs
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fL 'https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz' -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 python3-numpy
          /tmp/blender-4.5.14-linux-x64/blender --version | head -4
      - name: Build V3 body rig and facial morphs
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-4.5.14-linux-x64/blender --background \
            --python .github/scripts/rig-owner3d-v3.py -- \
            "$GITHUB_WORKSPACE/v3-rig-output/source.glb" \
            "$GITHUB_WORKSPACE/v3-rig-output/owner3d-v3.glb" \
            "$GITHUB_WORKSPACE/v3-rig-output"
          test -s v3-rig-output/owner3d-v3.glb
          test -s v3-rig-output/v3_report.json
          test -s v3-rig-output/body_neutral.png
          test -s v3-rig-output/body_articulation.png
          test -s v3-rig-output/body_leg_pose.png
          test -s v3-rig-output/face_neutral.png
          test -s v3-rig-output/face_expression.png
          test -s v3-rig-output/face_blink.png
      - name: Validate V3 skin and morph contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-owner3d-v3.py \
            v3-rig-output/owner3d-v3.glb \
            v3-rig-output/v3_validation.json
          test -s v3-rig-output/v3_validation.json
      - name: Upload V3 lab
        uses: actions/upload-artifact@v4
        with:
          name: owner3d-v3-fullbody-face
          path: v3-rig-output/
          if-no-files-found: error
