name: Validate iOS 0.3.2R2 Conversation Rebuild

on:
  push:
    branches: [candidate/ios-0.3.2R2-conversation-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify only conversation runtime changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=a3a614a101ad5def6de05dd1a351f7ae137dd7f4
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/workflows/validate-ios032r2.yml$' || true)"
          test "$changed" = "site/live-mobile.js"

      - name: Verify protected non-conversation files are byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/index.html)" = "9a5163b054bdabbefaa0761eeff58701b5e6d1de"
          test "$(git rev-parse HEAD:site/mobile.css)" = "a815f2314ac5a749435a73e41b3880922a0ca1d8"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"

      - name: Verify rebuilt conversation syntax and protocol guards
        shell: bash
        run: |
          set -euo pipefail
          node --check site/live-mobile.js
          grep -F "version:'0.3.2R2-conversation-rebuild'" site/live-mobile.js
          grep -F "contextWindowCompression:{slidingWindow:{}}" site/live-mobile.js
          grep -F "attachActiveHandlers(ws);" site/live-mobile.js
          grep -F "if(state.ws!==ws)return;" site/live-mobile.js
          grep -F "if(state.connectingWs!==ws)return;" site/live-mobile.js
          grep -F "const auth=await requestToken(!resume);" site/live-mobile.js
          grep -F "sessionResumption:handle?{handle}:{}" site/live-mobile.js
          grep -F "audio/pcm;rate=16000" site/live-mobile.js
          grep -F "createBuffer(1,samples.length,24000)" site/live-mobile.js
          grep -F "START_OF_ACTIVITY_INTERRUPTS" site/live-mobile.js

      - name: Simulate GoAway handover and stale socket close
        shell: bash
        run: |
          cat > /tmp/test-live.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          class N{constructor(){this.textContent='';this.dataset={};this.classList={toggle(){},remove(){}};this.listeners={};this.value=''}addEventListener(n,f){this.listeners[n]=f}}
          const ids=['talkButton','conversationState','conversationHint','userTranscript','lokyTranscript','activationPanel','pairCode','activateButton','liveBadge'];
          const nodes=Object.fromEntries(ids.map(x=>[x,new N()]));
          const media={active:true,getTracks(){return[{stop(){}}]}};
          class AC{constructor(){this.state='running';this.currentTime=0;this.destination={};this.sampleRate=48000}resume(){this.state='running';return Promise.resolve()}createMediaStreamSource(){return{connect(){},disconnect(){}}}createScriptProcessor(){return{connect(){},disconnect(){},onaudioprocess:null}}createGain(){return{gain:{value:0},connect(){},disconnect(){}}}createBuffer(c,n,r){return{duration:n/r,getChannelData(){return new Float32Array(n)}}}createBufferSource(){return{connect(){},start(){},stop(){},onended:null}}}
          let tokenCount=0;
          const fetch=async()=>({ok:true,json:async()=>({token:`token-${++tokenCount}`,model:'models/gemini-3.8-live'})});
          class WS{static OPEN=1;static all=[];constructor(url){this.url=url;this.readyState=0;WS.all.push(this);setTimeout(()=>{this.readyState=1;this.onopen?.()},0)}send(m){(this.sent??=[]).push(m)}close(){this.readyState=3;setTimeout(()=>this.onclose?.(),0)}emit(o){this.onmessage?.({data:JSON.stringify(o)})}}
          const store=new Map([['loky_pc4_device_capability_v1','1234567890abcdef']]);
          const s={console,setTimeout,clearTimeout,Blob:global.Blob,ArrayBuffer,TextDecoder,DataView,Uint8Array,Int16Array,Float32Array,btoa:x=>Buffer.from(x,'binary').toString('base64'),atob:x=>Buffer.from(x,'base64').toString('binary'),URL,history:{replaceState(){}},location:{href:'https://lowzzzz.github.io/LOKY-PC4-MOBILE/'},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)},navigator:{mediaDevices:{getUserMedia:async()=>media}},document:{getElementById:id=>nodes[id]||null},AudioContext:AC,webkitAudioContext:AC,WebSocket:WS,fetch,addEventListener(){}};
          s.window=s;vm.createContext(s);vm.runInContext(fs.readFileSync('site/live-mobile.js','utf8'),s);
          (async()=>{await s.LOKY_PC4_LIVE.start();await new Promise(r=>setTimeout(r,10));const a=WS.all[0];if(!a)throw Error('initial socket missing');a.emit({setupComplete:{}});await new Promise(r=>setTimeout(r,2));if(s.LOKY_PC4_LIVE.state.ws!==a||!s.LOKY_PC4_LIVE.state.setupReady)throw Error('initial setup failed');a.emit({sessionResumptionUpdate:{newHandle:'resume-1'}});a.emit({goAway:{timeLeft:'5s'}});await new Promise(r=>setTimeout(r,320));const b=WS.all[1];if(!b)throw Error('handover socket missing');a.close();await new Promise(r=>setTimeout(r,5));if(s.LOKY_PC4_LIVE.state.connectingWs!==b)throw Error('old close killed candidate');b.emit({setupComplete:{}});await new Promise(r=>setTimeout(r,5));if(s.LOKY_PC4_LIVE.state.ws!==b||!s.LOKY_PC4_LIVE.state.setupReady)throw Error('handover failed');a.onclose?.();await new Promise(r=>setTimeout(r,5));if(s.LOKY_PC4_LIVE.state.ws!==b||!s.LOKY_PC4_LIVE.state.setupReady)throw Error('stale close corrupted active session');if(tokenCount!==1)throw Error('resume did not reuse token');console.log('SESSION_HANDOVER_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/test-live.js

      - name: Verify Gemini token backend remains healthy
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
