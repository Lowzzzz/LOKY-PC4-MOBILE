name: Validate iOS 0.3.2R4 Clean Dock CSS Only

on:
  push:
    branches: [candidate/ios-0.3.2R4-ui-clean-dock-css-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify only CSS runtime changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=c800d2b529a6e6f48fad60b756f92c5b24d58a29
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' || true)"
          test "$changed" = "site/mobile.css"

      - name: Verify frozen R4 conversation and functional DOM are byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/index.html)" = "9a5163b054bdabbefaa0761eeff58701b5e6d1de"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"

      - name: Verify clean dock visual contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'position:absolute;z-index:30;left:0;right:0' site/mobile.css
          grep -F 'width:62px;height:62px' site/mobile.css
          grep -F 'font-size:0;color:transparent' site/mobile.css
          grep -F 'animation:dock-idle 2.4s ease-in-out infinite' site/mobile.css
          grep -F '@keyframes dock-halo-active' site/mobile.css
          grep -F 'clip-path:inset(50%)' site/mobile.css
          grep -F '.conversation-actions{display:none}' site/mobile.css
          grep -F '.live-badge{display:none!important}' site/mobile.css
          grep -F '.activation-panel{' site/mobile.css
          grep -F 'pointer-events:auto' site/mobile.css
          if grep -q '^\.conversation-shell{display:none' site/mobile.css; then
            echo 'Functional conversation shell must remain in DOM/layout contract'
            exit 1
          fi

      - name: Verify frozen R4 conversation syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/live-mobile.js
          grep -F "const VERSION='0.3.2R4-pc4-conversation-port'" site/live-mobile.js
          grep -F 'automaticActivityDetection:{disabled:true}' site/live-mobile.js
          grep -F "sendRealtime(ws,{activityStart:{}})" site/live-mobile.js
          grep -F "sendRealtime(ws,{activityEnd:{}})" site/live-mobile.js

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
