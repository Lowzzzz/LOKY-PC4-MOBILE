name: Validate iOS 0.3.2R4F2 Settings Memory Windows

on:
  push:
    branches: [candidate/ios-0.3.2R4F2-settings-memory-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated runtime scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=5c11f85fe971e34d83038501fe18116a55d0bbd0
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' | sort || true)"
          expected=$'site/mobile-features.js\nsite/mobile.css'
          test "$changed" = "$expected"

      - name: Verify frozen core is byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"
          test "$(git rev-parse HEAD:site/index.html)" = "b88b10867fa418a1ea521235ecc0be9c44f5e99c"

      - name: Verify R4F2 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-features.js
          grep -F "const VERSION='0.3.2R4F2-settings-memory-windows'" site/mobile-features.js
          grep -F "const SETTINGS_KEY='loky_pc4_mobile_settings_v1'" site/mobile-features.js
          grep -F "vulgar:{label:'Vulgar'" site/mobile-features.js
          grep -F "button.classList.add('is-action','feature-settings')" site/mobile-features.js
          grep -F "button.classList.add('is-action','feature-memory')" site/mobile-features.js
          grep -F "createFeatureWindow('settings'" site/mobile-features.js
          grep -F "createFeatureWindow('memory'" site/mobile-features.js
          grep -F "['RECORDATORIOS','Avisos y tareas pendientes','R']" site/mobile-features.js
          grep -F "['CALENDARIO','Eventos y agenda','C']" site/mobile-features.js
          grep -F "['ALARMAS','Alarmas y temporizadores','A']" site/mobile-features.js
          grep -F '.loky-feature-window{' site/mobile.css
          grep -F '.future-op-button.is-action{' site/mobile.css
          grep -F 'body.loky-window-open .app-shell{' site/mobile.css
          grep -F '.loky-feature-window.is-open{' site/mobile.css
          grep -F '.loky-feature-window.is-closing{' site/mobile.css

      - name: Run R4F2 feature tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs

      - name: Re-run frozen R4 conversation tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
