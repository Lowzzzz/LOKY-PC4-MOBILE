name: Validate iOS 0.3.2R4F5 Devices QR

on:
  push:
    branches: [candidate/ios-0.3.2R4F5-devices-qr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated runtime scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=92482edda0bdc69ce1a2f408d450af6f343176eb
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' || true)"
          expected=$'site/index.html\nsite/mobile-settings-plus.js'
          test "$changed" = "$expected"

      - name: Verify protected Mobile runtime byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "a9c02db6ffcf8efcb76d8e1bc35ca5439240a81f"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          test "$(git rev-parse HEAD:site/mobile-noise-guard.js)" = "c632c64738c0bb34d7e372d28a5532d238b23398"
          test "$(git rev-parse HEAD:site/mobile-seismic.js)" = "6acbdcad502f1313a5af5ae2d675ba23340d38d9"
          test "$(git rev-parse HEAD:site/mobile-earth-reference.js)" = "34b1d603625476b569f275c5720a08603711ed73"

      - name: Verify Devices QR layer
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-settings-plus.js
          node .github/tests/ios032r4f5-devices-qr.test.cjs
          grep -F '<script src="./mobile-settings-plus.js?v=0.3.2r4f5"></script>' site/index.html
          grep -F "const VERSION='0.3.2R4F5-devices-qr'" site/mobile-settings-plus.js
          grep -F '04f46c6a0708418cb7b96fc563eacae0fbf77674' site/mobile-settings-plus.js
          if grep -Eq 'getUserMedia\s*\(|new\s+WebSocket\s*\(|LOKY_PC4_LIVE' site/mobile-settings-plus.js; then exit 1; fi

      - name: Re-run frozen conversation and visual tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs
          node .github/tests/ios032r4f2r1-noise-guard.test.cjs
          node .github/tests/ios032r4f4r2-fps-startup.test.cjs

      - name: Verify device backend health
        shell: bash
        run: |
          set -euo pipefail
          DEV='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-devices'
          TOKEN='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$DEV" -o /tmp/device-health.json
          node -e "const x=require('/tmp/device-health.json'); if(!x.ok||x.version!==1) process.exit(2)"
          curl -fsS "$TOKEN" -o /tmp/token-health.json
          node -e "const x=require('/tmp/token-health.json'); if(!x.ok||x.auth!=='owner-or-invited-device-capability'||x.model!=='models/gemini-3.8-live') process.exit(2)"
          code=$(curl -sS -o /tmp/device-denied.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-loky-device: invalid-device-123456789' --data '{"action":"status"}' "$DEV")
          test "$code" = '401'
          code=$(curl -sS -o /tmp/token-denied.json -w '%{http_code}' -X POST -H 'x-loky-device: invalid-device-123456789' "$TOKEN")
          test "$code" = '401'

      - name: Verify pinned QR library reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js' -o /tmp/qrcode.min.js
          grep -F 'QRCode' /tmp/qrcode.min.js >/dev/null
