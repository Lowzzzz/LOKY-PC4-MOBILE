name: Owner3D R8R14 Rig V2 Revalidation

on:
  push:
    branches: [work/owner3d-r8r14-rig-v2-revalidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner3d-r8r14-rig-v2-revalidate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected R8R13 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/mobile-language-tutor.js)" = "463784a9deed990165c3aa5585aff741a583b71b"
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "f28a58275661f8513e9e3b29911c62f51e04bd28"
          test "$(git rev-parse HEAD:site/sw.js)" = "17a9b05710f48efcf5325c81016450324ab94884"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"

      - name: Reconstruct exact rig V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8r14-output
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,struct
          root=Path("site/assets/owner3d-rig-v2")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"]=="owner3d-rig-v2-axisfix"
          assert manifest["bytes"]==11912184
          assert manifest["sha256"]=="ebc82865275bf5ff0cdf7e3a42e6cad50922030f2c29124f6220ed1de66de64e"
          check=manifest["orientationWeightCheck"]
          assert check["bottom_foot_shin_ratio"]==1.0
          assert check["top_head_neck_ratio"]==1.0
          assert check["bottom_upper_leaks"]==0
          assert check["top_leg_leaks"]==0
          parts=[(root/f"chunk_{i:03d}.txt").read_text(encoding="ascii").strip() for i in range(18)]
          raw=base64.b64decode("".join(parts),validate=True)
          assert len(raw)==11912184
          assert hashlib.sha256(raw).hexdigest()==manifest["sha256"]
          magic,version,total=struct.unpack_from("<4sII",raw,0)
          assert magic==b"glTF" and version==2 and total==len(raw)
          Path("r8r14-output/owner3d-rig-v2.glb").write_bytes(raw)
          print("RIG_V2_EXACT_PASS")
          PY

      - name: Validate foot skinning mathematically
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y python3-numpy >/dev/null
          python3 .github/scripts/validate-owner3d-rig-v2.py             r8r14-output/owner3d-rig-v2.glb             r8r14-output/rig-v2-validation.json
          python3 - <<'PY'
          import json
          r=json.load(open("r8r14-output/rig-v2-validation.json"))
          o=r["orientation_weight_check"]
          assert o["bottom_upper_leaks"]==0,o
          assert o["top_leg_leaks"]==0,o
          assert o["bottom_foot_shin_ratio"]==1.0,o
          assert o["top_head_neck_ratio"]==1.0,o
          static=("pelvis","spine","chest","thigh.L","shin.L","foot.L","thigh.R","shin.R","foot.R")
          for name in static:
              assert r["group_stats"][name]["max_delta"]<1e-7,(name,r["group_stats"][name])
          assert r["group_stats"]["head"]["max_delta"]>0.005
          print("FOOT_VERTEX_STABILITY_PASS")
          PY

      - name: Verify R8R14 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-language-avatar-owner3d.js
          grep -F "0.3.2R4F12R8R14-owner-rig-v2-revalidated" site/mobile-language-avatar-owner3d.js
          grep -F "owner3d-rig-v2/chunk_" site/mobile-language-avatar-owner3d.js
          grep -F "Array.from({length:18}" site/mobile-language-avatar-owner3d.js
          grep -F "uniform mat4 uJoints[24];" site/mobile-language-avatar-owner3d.js
          grep -F "const model=modelMatrix(0,1,1);" site/mobile-language-avatar-owner3d.js
          grep -F "const OWNER_HINT_KEY='loky_pc4_owner3d_hint_v1';" site/mobile-language-avatar-owner3d.js
          grep -F '<script src="./mobile-language-avatar-owner3d.js?v=0.3.2r4f12r8r14"></script>' site/index.html
          grep -F '<script src="./mobile-language-tutor.js?v=0.3.2r4f12r6r1"></script>' site/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("site/index.html").read_text()
          assert s.index("mobile-language-avatar-owner3d.js?v=0.3.2r4f12r8r14") < s.index("mobile-language-tutor.js?v=0.3.2r4f12r6r1")
          print("OWNER_BEFORE_TUTOR_PASS")
          PY

      - name: Build real WebGL runtime page
        shell: bash
        run: |
          set -euo pipefail
          cat > site/r8r14-real.html <<'HTML'
          <!doctype html><html><body style="margin:0;background:#02070b;color:#bdefff;font:12px monospace">
          <canvas id="c" width="390" height="720" style="display:block;width:390px;height:720px"></canvas>
          <pre id="result">PENDING</pre>
          <script src="./mobile-language-avatar-owner3d.js"></script>
          <script>
          (async()=>{
            const result=document.getElementById('result');
            try{
              const canvas=document.getElementById('c');
              const avatar=new window.LOKY_MESHY_AVATAR_3D.Avatar(canvas,{});
              window.__avatar=avatar;
              const urls=Array.from({length:18},(_,i)=>'./assets/owner3d-rig-v2/chunk_'+String(i).padStart(3,'0')+'.txt');
              const stats=await avatar.loadBase64ChunkUrls(urls);
              avatar.stop();
              avatar.drag={test:true};
              avatar.setState('speaking');
              avatar.running=true;
              avatar._frame(100);
              avatar.stop();
              const names=avatar.rig.jointNames;
              const first=Array.from(avatar.rig.jointMatrices);
              avatar.running=true;
              avatar._frame(2700);
              avatar.stop();
              const second=Array.from(avatar.rig.jointMatrices);
              const diffs={};
              for(let j=0;j<names.length;j++){
                let m=0;
                for(let k=0;k<16;k++)m=Math.max(m,Math.abs(first[j*16+k]-second[j*16+k]));
                diffs[names[j]]=m;
              }
              const staticNames=['pelvis','spine','chest','thigh.L','shin.L','foot.L','thigh.R','shin.R','foot.R'];
              const lower=Math.max(...staticNames.map(n=>diffs[n]||0));
              const upper=Math.max(diffs['head']||0,diffs['upper_arm.L']||0,diffs['upper_arm.R']||0);
              const gl=canvas.getContext('webgl2'); gl.finish(); const err=gl.getError();
              if(stats.vertices!==167772||stats.triangles!==180000||stats.joints!==18)throw new Error('BAD_STATS_'+JSON.stringify(stats));
              if(!(lower<1e-7))throw new Error('FEET_MOVED_'+JSON.stringify({lower,diffs}));
              if(!(upper>0.005))throw new Error('UPPER_STATIC_'+JSON.stringify({upper,diffs}));
              if(err!==gl.NO_ERROR)throw new Error('GL_'+err);
              window.__report={lower,upper,diffs};
              result.textContent='R8R14_PASS FEET_'+lower+' UPPER_'+upper+' GL_'+err;
            }catch(e){result.textContent='R8R14_FAIL '+String(e?.stack||e);}
          })();
          </script></body></html>
          HTML

      - name: Run real rig V2 in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd site
          python3 -m http.server 8798 --bind 127.0.0.1 >/tmp/r8r14-http.log 2>&1 &
          SERVER=$!
          cd ..
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist             --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader             --window-size=390,780 --remote-debugging-port=9226 --user-data-dir=/tmp/r8r14-chrome             http://127.0.0.1:8798/r8r14-real.html >/tmp/r8r14-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9226/json >/tmp/r8r14-pages.json && break || true; sleep .25; done
          node <<'NODE'
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            let pages;
            for(let i=0;i<40;i++){
              try{pages=await (await fetch('http://127.0.0.1:9226/json')).json();if(pages?.length)break;}catch{}
              await sleep(250);
            }
            const page=pages.find(x=>x.type==='page');
            const ws=new WebSocket(page.webSocketDebuggerUrl);
            await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
            let id=1; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m);}};
            const call=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
            await call('Runtime.enable'); await call('Page.enable');
            let text='';
            for(let i=0;i<200;i++){
              const r=await call('Runtime.evaluate',{expression:"document.getElementById('result').textContent",returnByValue:true});
              text=String(r.result.result.value||'');
              if(text.startsWith('R8R14_PASS'))break;
              if(text.startsWith('R8R14_FAIL'))throw new Error(text);
              await sleep(250);
            }
            if(!text.startsWith('R8R14_PASS'))throw new Error('TIMEOUT '+text);
            const rep=await call('Runtime.evaluate',{expression:"JSON.stringify(window.__report)",returnByValue:true});
            fs.writeFileSync('r8r14-output/webgl-report.json',JSON.stringify(JSON.parse(rep.result.result.value),null,2)+'\n');
            const shot=await call('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true});
            fs.writeFileSync('r8r14-output/runtime.png',Buffer.from(shot.result.data,'base64'));
            fs.writeFileSync('r8r14-output/result.txt',text+'\n');
            console.log(text);
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1);});
          NODE
          grep -F 'R8R14_PASS FEET_0 ' r8r14-output/result.txt
          test -s r8r14-output/runtime.png
          test -s r8r14-output/webgl-report.json

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: owner3d-r8r14-rig-v2-proof
          path: r8r14-output/
          if-no-files-found: error
