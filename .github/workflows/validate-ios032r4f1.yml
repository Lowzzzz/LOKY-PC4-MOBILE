name: Validate iOS 0.3.2R4F1 Mobile Features

on:
  push:
    branches: [candidate/ios-0.3.2R4F1-silence-memory-slots]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen conversation and non-feature runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"

      - name: Verify index changes only load isolated feature layer
        shell: bash
        run: |
          set -euo pipefail
          git show c800d2b529a6e6f48fad60b756f92c5b24d58a29:site/index.html > /tmp/base-index.html
          grep -v 'mobile-features.js' site/index.html > /tmp/current-without-feature.html
          cmp /tmp/base-index.html /tmp/current-without-feature.html
          grep -F '<script src="./mobile-features.js?v=0.3.2r4f1"></script>' site/index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/live-mobile.js
          node --check site/mobile-features.js
          node --check site/app.js
          node --check site/sphere-mobile.js
          node --check site/ios-audio-stability.js
          node --check site/sw.js

      - name: Run silence memory and future-slot tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4f1-features.test.cjs

      - name: Verify visual silence and reserved slots CSS
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'body.loky-silenced #lokySphere' site/mobile.css
          grep -F 'body.loky-silenced .orbital-ring' site/mobile.css
          grep -F 'body.loky-silenced #conversationState::after' site/mobile.css
          grep -F '.future-op-button' site/mobile.css
          grep -F '.future-op-1' site/mobile.css
          grep -F '.future-op-2' site/mobile.css
          grep -F '.future-op-3' site/mobile.css
          grep -F '.future-op-4' site/mobile.css

      - name: Verify frozen R4 conversation tests still pass
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
