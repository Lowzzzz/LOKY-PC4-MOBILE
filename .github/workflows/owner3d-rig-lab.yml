name: Owner3D Rig Lab

on:
  push:
    branches: [work/owner3d-rig-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rig lab
        uses: actions/checkout@v4

      - name: Reconstruct approved Owner GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rig-output
          python3 - <<'PY'
          from pathlib import Path
          import base64, struct, json
          parts=[]
          for i in range(13):
              p=Path(f"site/assets/owner3d/chunk_{i:03d}.txt")
              assert p.is_file(), p
              parts.append(p.read_text(encoding="utf-8").strip())
          raw=base64.b64decode("".join(parts),validate=True)
          magic,version,total=struct.unpack_from("<4sII",raw,0)
          assert magic==b"glTF" and version==2 and total==len(raw)==8536252
          Path("rig-output/owner3d-approved.glb").write_bytes(raw)
          print("RECONSTRUCTED",len(raw))
          PY

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -5

      - name: Build humanoid rig candidate
        shell: bash
        run: |
          set -euo pipefail
          blender --background             --python .github/scripts/rig-owner3d-v1.py             --             "$GITHUB_WORKSPACE/rig-output/owner3d-approved.glb"             "$GITHUB_WORKSPACE/rig-output/owner3d-rig-v1.glb"             "$GITHUB_WORKSPACE/rig-output"

      - name: Validate rigged GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path("rig-output/owner3d-rig-v1.glb")
          assert p.is_file() and p.stat().st_size>1_000_000
          raw=p.read_bytes()
          magic,version,total=struct.unpack_from("<4sII",raw,0)
          assert magic==b"glTF" and version==2 and total==len(raw)
          off=12
          gltf=None
          while off<len(raw):
              ln,tp=struct.unpack_from("<II",raw,off); off+=8
              data=raw[off:off+ln]; off+=ln
              if tp==0x4E4F534A:
                  gltf=json.loads(data.rstrip(b"\x00 ").decode("utf-8"))
          assert gltf
          assert len(gltf.get("skins",[]))>=1, "No skin exported"
          attrs=[]
          for m in gltf.get("meshes",[]):
              for prim in m.get("primitives",[]):
                  attrs.append(prim.get("attributes",{}))
          assert any("JOINTS_0" in a and "WEIGHTS_0" in a for a in attrs), "No skin attributes"
          joints=gltf["skins"][0].get("joints",[])
          assert len(joints)>=12, len(joints)
          print("RIGGED_GLB_PASS",p.stat().st_size,"bytes",len(joints),"joints")
          PY
          test -s rig-output/rig_neutral.png
          test -s rig-output/rig_pose.png
          test -s rig-output/rig_report.json

      - name: Upload rig lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: owner3d-rig-v1
          path: rig-output/
          if-no-files-found: error
