name: Validate iOS 0.3.2R4F3R1 Globe Detail Layout

on:
  push:
    branches: [candidate/ios-0.3.2R4F3R1-globe-detail-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated runtime scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=c677250b36be53991608d95d7230f0dde663cae6
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' || true)"
          test "$changed" = 'site/mobile-seismic.js'

      - name: Verify frozen Mobile baseline and R4F3 loader byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "a9c02db6ffcf8efcb76d8e1bc35ca5439240a81f"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          test "$(git rev-parse HEAD:site/mobile-noise-guard.js)" = "c632c64738c0bb34d7e372d28a5532d238b23398"
          test "$(git rev-parse HEAD:site/index.html)" = "a4931a5db333bd53032a8bbb71646d2e1f909c20"

      - name: Verify Sismos detail layout contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-seismic.js
          grep -F "const VERSION='0.3.2R4F3R1-globe-detail-layout'" site/mobile-seismic.js
          grep -F 'width:118%;height:118%' site/mobile-seismic.js
          grep -F 'top:14px;bottom:auto' site/mobile-seismic.js
          grep -F 'const DETAIL_LINES=[' site/mobile-seismic.js
          grep -F 'function drawLand(' site/mobile-seismic.js
          grep -F 'for(let lat=-75;lat<=75;lat+=15)' site/mobile-seismic.js
          grep -F "earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson" site/mobile-seismic.js
          grep -F "navigator.geolocation.getCurrentPosition" site/mobile-seismic.js
          grep -F "features?.slots?.[1]" site/mobile-seismic.js
          grep -F "SPHERE_MAX_ZOOM=2.6" site/mobile-seismic.js
          grep -F "GLOBE_MAX_ZOOM=3.2" site/mobile-seismic.js
          grep -F '<script src="./mobile-seismic.js?v=0.3.2r4f3"></script>' site/index.html
          if grep -Eq 'getUserMedia\s*\(|new\s+WebSocket\s*\(|LOKY_PC4_LIVE' site/mobile-seismic.js; then
            echo 'Sismos must not own mic/WebSocket/Conversation R4 state'
            exit 1
          fi

      - name: Run Sismos detail layout tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4f3-sismos-globe.test.cjs

      - name: Re-run frozen conversation and feature tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs
          node .github/tests/ios032r4f2r1-noise-guard.test.cjs

      - name: Verify USGS realtime feed
        shell: bash
        run: |
          set -euo pipefail
          URL='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson'
          curl -fsS "$URL" -o /tmp/quakes.json
          node -e "const x=require('/tmp/quakes.json'); if(x.type!=='FeatureCollection'||!Array.isArray(x.features)||!x.metadata) process.exit(2);"

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/loky-health.json
          node -e "const x=require('/tmp/loky-health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
