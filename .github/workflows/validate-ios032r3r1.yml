name: Validate iOS 0.3.2R3R1 Conversation Stability

on:
  push:
    branches: [candidate/ios-0.3.2R3R1-bargein-voice-stability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify only conversation runtime changed
        shell: bash
        run: |
          set -euo pipefail
          BASE=ccedd18e69a0394bfd31ae0509c6530076a0de08
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' || true)"
          test "$changed" = "site/live-mobile.js"

      - name: Verify protected non-conversation runtime is byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/index.html)" = "9a5163b054bdabbefaa0761eeff58701b5e6d1de"
          test "$(git rev-parse HEAD:site/mobile.css)" = "a815f2314ac5a749435a73e41b3880922a0ca1d8"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"

      - name: Verify conversation syntax and protocol settings
        shell: bash
        run: |
          set -euo pipefail
          node --check site/live-mobile.js
          grep -F "const VERSION='0.3.2R3R1-bargein-voice-stability'" site/live-mobile.js
          grep -F 'const MIC_BUFFER_SIZE=2048' site/live-mobile.js
          grep -F 'const END_SILENCE_MS=250' site/live-mobile.js
          grep -F "START_OF_ACTIVITY_INTERRUPTS" site/live-mobile.js
          grep -F "prebuiltVoiceConfig:{voiceName:'Kore'}" site/live-mobile.js
          grep -F 'if(resume?.resumable===true&&resume?.newHandle)' site/live-mobile.js
          grep -F 'state.suppressPlaybackUntil=Date.now()+LOCAL_BARGE_SUPPRESS_MS' site/live-mobile.js
          grep -F 'if(Date.now()<state.suppressPlaybackUntil)return;' site/live-mobile.js
          grep -F 'contextWindowCompression:{slidingWindow:{}}' site/live-mobile.js
          if grep -R -E -qi 'QWEN|FALLBACK LOCAL|speechSynthesis' site/live-mobile.js; then exit 1; fi

      - name: Run barge-in and voice-continuity test
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r3r1-conversation.test.cjs

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
