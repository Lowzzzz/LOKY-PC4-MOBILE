name: Owner3D R8R11 Double-Sided Smoke

on:
  push:
    branches: [work/owner3d-r8r11-double-sided]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner3d-r8r11-double-sided
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/mobile-language-tutor.js)" = "980122bcf882130f2f44496af104eb852eff8531"
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "f28a58275661f8513e9e3b29911c62f51e04bd28"
          test "$(git rev-parse HEAD:site/sw.js)" = "17a9b05710f48efcf5325c81016450324ab94884"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"

      - name: Verify R8R11 contract and rig material
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-language-avatar-owner3d.js
          grep -F "0.3.2R4F12R8R11-owner-rig-double-sided" site/mobile-language-avatar-owner3d.js
          grep -F "const doubleSided=mat.doubleSided===true;" site/mobile-language-avatar-owner3d.js
          grep -F "this._setup(P,N,U,I,image,J,W,rig,doubleSided);" site/mobile-language-avatar-owner3d.js
          grep -F "if(!gl_FrontFacing)n=-n;" site/mobile-language-avatar-owner3d.js
          grep -F "if(doubleSided){gl.disable(gl.CULL_FACE);}" site/mobile-language-avatar-owner3d.js
          grep -F "this.doubleSided=doubleSided;" site/mobile-language-avatar-owner3d.js
          grep -F '<script src="./mobile-language-avatar-owner3d.js?v=0.3.2r4f12r8r11"></script>' site/index.html
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,struct
          root=Path("site/assets/owner3d-rig-v1")
          manifest=json.loads((root/"manifest.json").read_text())
          parts=[(root/f"chunk_{i:03d}.txt").read_text().strip() for i in range(18)]
          raw=base64.b64decode("".join(parts),validate=True)
          assert len(raw)==11911980
          assert hashlib.sha256(raw).hexdigest()=="a8c8a62813afb329f53d3de3d87623ac90352750c39f0f445f8e3c84b000c2ab"
          off=12; gltf=None
          while off<len(raw):
              ln,tp=struct.unpack_from("<II",raw,off); off+=8
              data=raw[off:off+ln]; off+=ln
              if tp==0x4E4F534A:
                  gltf=json.loads(data.rstrip(b"\x00 ").decode())
          prim=gltf["meshes"][0]["primitives"][0]
          mat=gltf["materials"][prim.get("material",0)]
          assert mat.get("doubleSided") is True
          assert len(gltf["skins"][0]["joints"])==18
          print("DOUBLE_SIDED_RIG_ASSET_PASS")
          PY

      - name: Build rear-view runtime page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8r11-proof
          cat > site/r8r11-rear.html <<'HTML'
          <!doctype html><html><body style="margin:0;background:#02070b;color:#bdefff;font:12px monospace">
          <canvas id="c" width="390" height="720" style="display:block;width:390px;height:720px"></canvas>
          <pre id="result">PENDING</pre>
          <script src="./mobile-language-avatar-owner3d.js"></script>
          <script>
          (async()=>{
            const result=document.getElementById('result');
            try{
              const canvas=document.getElementById('c');
              const avatar=new window.LOKY_MESHY_AVATAR_3D.Avatar(canvas,{});
              window.__a=avatar;
              const urls=Array.from({length:18},(_,i)=>'./assets/owner3d-rig-v1/chunk_'+String(i).padStart(3,'0')+'.txt');
              const stats=await avatar.loadBase64ChunkUrls(urls);
              avatar.yaw=Math.PI;
              avatar.distance=3.35;
              avatar.focusZ=-0.08;
              avatar.setState('listening');
              const gl=canvas.getContext('webgl2');
              setTimeout(()=>{
                gl.finish();
                const err=gl.getError();
                const cull=gl.isEnabled(gl.CULL_FACE);
                if(stats.doubleSided!==true)throw new Error('NOT_DOUBLE_SIDED');
                if(cull)throw new Error('CULL_STILL_ENABLED');
                if(err!==gl.NO_ERROR)throw new Error('GL_ERROR_'+err);
                result.textContent='R8R11_PASS DOUBLE_'+stats.doubleSided+' CULL_'+cull+' GL_'+err;
              },1000);
            }catch(e){result.textContent='R8R11_FAIL '+String(e?.stack||e);}
          })();
          </script>
          </body></html>
          HTML

      - name: Run Chrome rear-view proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd site
          python3 -m http.server 8796 --bind 127.0.0.1 >/tmp/r8r11-http.log 2>&1 &
          SERVER=$!
          cd ..
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist             --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader             --window-size=390,780 --remote-debugging-port=9224 --user-data-dir=/tmp/r8r11-chrome             http://127.0.0.1:8796/r8r11-rear.html >/tmp/r8r11-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9224/json >/tmp/r8r11-pages.json && break || true; sleep .25; done
          node <<'NODE'
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            let pages;
            for(let i=0;i<40;i++){
              try{pages=await (await fetch('http://127.0.0.1:9224/json')).json();if(pages?.length)break;}catch{}
              await sleep(250);
            }
            const page=pages.find(x=>x.type==='page');
            const ws=new WebSocket(page.webSocketDebuggerUrl);
            await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
            let id=1; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m);}};
            const call=(method,params={})=>new Promise((resolve,reject)=>{const n=id++;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
            await call('Runtime.enable'); await call('Page.enable');
            let text='';
            for(let i=0;i<160;i++){
              const r=await call('Runtime.evaluate',{expression:"document.getElementById('result').textContent",returnByValue:true});
              text=String(r.result.result.value||'');
              if(text.startsWith('R8R11_PASS'))break;
              if(text.startsWith('R8R11_FAIL'))throw new Error(text);
              await sleep(250);
            }
            if(!text.startsWith('R8R11_PASS'))throw new Error('TIMEOUT '+text);
            await sleep(900);
            const shot=await call('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true});
            fs.writeFileSync('r8r11-proof/rear-double-sided.png',Buffer.from(shot.result.data,'base64'));
            fs.writeFileSync('r8r11-proof/result.txt',text+'\n');
            console.log(text);
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1);});
          NODE
          grep -F 'R8R11_PASS DOUBLE_true CULL_false GL_0' r8r11-proof/result.txt
          test -s r8r11-proof/rear-double-sided.png

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: owner3d-r8r11-double-sided-proof
          path: r8r11-proof/
          if-no-files-found: error
