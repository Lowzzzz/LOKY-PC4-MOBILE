name: Deploy LOKY PC4 Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact frozen app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cat deploy/icon180.part00 deploy/icon180.part01 deploy/icon180.part02 | tr -d '\r\n ' | base64 --decode > site/icons/icon-180.png
          cat deploy/icon512.part00 deploy/icon512.part01 deploy/icon512.part02 deploy/icon512.part03 deploy/icon512.part04a deploy/icon512.fix00 deploy/icon512.fix01 deploy/icon512.fix02 deploy/icon512.fix03 | tr -d '\r\n ' | base64 --decode > site/icons/icon-512.png

      - name: Verify frozen iOS 0.1 visual core
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../PROTECTED_0_1_VISUAL_SHA256.txt

      - name: Verify protected 0.3.2 non-conversation runtime is byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/index.html)" = "9a5163b054bdabbefaa0761eeff58701b5e6d1de"
          test "$(git rev-parse HEAD:site/mobile.css)" = "a815f2314ac5a749435a73e41b3880922a0ca1d8"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sphere-mobile.js
          node --check site/app.js
          node --check site/live-mobile.js
          node --check site/ios-audio-stability.js
          node --check site/sw.js

      - name: Verify iOS 0.3.2R3R1 conversation stability
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const BUILD='0.3.2'" site/app.js
          grep -F "phase:'gemini-live-native'" site/app.js
          grep -F '"version": "0.3.2"' site/version.json
          grep -F "const VERSION='0.3.2R3R1-bargein-voice-stability'" site/live-mobile.js
          grep -F 'const MIC_BUFFER_SIZE=2048' site/live-mobile.js
          grep -F 'const END_SILENCE_MS=250' site/live-mobile.js
          grep -F 'const LOCAL_BARGE_MIN_RMS=0.04' site/live-mobile.js
          grep -F 'const LOCAL_BARGE_FRAMES=2' site/live-mobile.js
          grep -F 'const LOCAL_BARGE_SUPPRESS_MS=900' site/live-mobile.js
          grep -F 'detectLocalBargeIn(input);' site/live-mobile.js
          grep -F 'if(Date.now()<state.suppressPlaybackUntil)return;' site/live-mobile.js
          grep -F "prebuiltVoiceConfig:{voiceName:'Kore'}" site/live-mobile.js
          grep -F 'if(resume?.resumable===true&&resume?.newHandle)' site/live-mobile.js
          grep -F 'START_OF_ACTIVITY_INTERRUPTS' site/live-mobile.js
          grep -F 'contextWindowCompression:{slidingWindow:{}}' site/live-mobile.js
          grep -F "navigator.audioSession.type=type" site/ios-audio-stability.js
          grep -F "await ctx.suspend()" site/ios-audio-stability.js
          grep -F "await ctx.resume()" site/ios-audio-stability.js
          grep -F 'ios-audio-stability.js?v=0.3.2' site/index.html
          if grep -R -E -q 'AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY|x-goog-api-key|GN8M-9PCC-EQV6-XK4A' site; then
            echo 'Secret/API key material must never be present in public Mobile files'
            exit 1
          fi
          if grep -R -E -qi 'QWEN|FALLBACK LOCAL|speechSynthesis' site; then
            echo 'Local robotic voice fallback is forbidden in native Live build'
            exit 1
          fi

      - name: Run conversation stability test
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r3r1-conversation.test.cjs

      - name: Verify secure token backend health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/loky-health.json
          node -e "const x=require('/tmp/loky-health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
          code=$(curl -sS -o /tmp/loky-denied.json -w '%{http_code}' -X POST -H 'x-loky-device: invalid-device' "$URL")
          test "$code" = '401'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
