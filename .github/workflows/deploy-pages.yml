name: Deploy LOKY PC4 Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact frozen app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cat deploy/icon180.part00 deploy/icon180.part01 deploy/icon180.part02 | tr -d '\r\n ' | base64 --decode > site/icons/icon-180.png
          cat deploy/icon512.part00 deploy/icon512.part01 deploy/icon512.part02 deploy/icon512.part03 deploy/icon512.part04a deploy/icon512.fix00 deploy/icon512.fix01 deploy/icon512.fix02 deploy/icon512.fix03 | tr -d '\r\n ' | base64 --decode > site/icons/icon-512.png

      - name: Build R4F6 precompiled Earth geometry
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/build-earth-geometry-r4f6.cjs
          node .github/scripts/build-earth-geometry-r4f6.cjs
          node -e "const x=require('./site/earth-geometry-r4f6.json'); if(x.version!=='r4f6-precompiled-v1'||x.naturalEarthCommit!=='ca96624a56bd078437bca8184e78163e5039ad19'||!Array.isArray(x.landRings)||x.landRings.length<20||!Array.isArray(x.countryRings)||x.countryRings.length<20||!Array.isArray(x.dots)||x.dots.length<1500||x.dots.length>9800) process.exit(2)"

      - name: Verify frozen iOS 0.1 visual core
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../PROTECTED_0_1_VISUAL_SHA256.txt

      - name: Verify frozen conversation and protected runtime byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "a9c02db6ffcf8efcb76d8e1bc35ca5439240a81f"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          test "$(git rev-parse HEAD:site/mobile-noise-guard.js)" = "c632c64738c0bb34d7e372d28a5532d238b23398"

      - name: Verify R4F6 Earth update delivery and R4F5 Devices runtime exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/index.html)" = "96cf22a3ab11dea61c3d884ee83c842fccfe3b65"
          test "$(git rev-parse HEAD:site/mobile-seismic.js)" = "6acbdcad502f1313a5af5ae2d675ba23340d38d9"
          test "$(git rev-parse HEAD:site/mobile-earth-reference.js)" = "310e6b59f54e504b60f4eb313dd8abb247a64ea4"
          test "$(git rev-parse HEAD:site/mobile-settings-plus.js)" = "e0be0e36a8a45402664e9096b14f75106dfa0bce"
          test "$(git rev-parse HEAD:site/sw.js)" = "6d35687e7ca347a6082119e7dd23969e616f61cb"
          if test -e site/mobile-continent-detail.js; then exit 1; fi
          grep -F '<script src="./mobile-settings-plus.js?v=0.3.2r4f5"></script>' site/index.html
          grep -F '<script src="./mobile-earth-reference.js?v=0.3.2r4f6"></script>' site/index.html
          grep -F "const VERSION='0.3.2R4F5R4-guest-handoff'" site/mobile-settings-plus.js
          grep -F "const VERSION='0.3.2R4F4R1-seismic-controller'" site/mobile-seismic.js
          grep -F "const VERSION='0.3.2R4F6-seismic-instant-precompiled'" site/mobile-earth-reference.js
          grep -F "const PRECOMPILED_URL='./earth-geometry-r4f6.json'" site/mobile-earth-reference.js
          grep -F 'function scheduleWarmGeometry(' site/mobile-earth-reference.js
          grep -F 'scheduleWarmGeometry();' site/mobile-earth-reference.js
          grep -F "const VERSION='loky-pc4-mobile-ios-0.3.2-r4f6'" site/sw.js
          grep -F 'mobile-settings-plus\\.js' site/sw.js
          grep -F 'mobile-seismic\\.js' site/sw.js
          grep -F 'mobile-earth-reference\\.js' site/sw.js
          grep -F 'earth-geometry-r4f6\\.json' site/sw.js
          grep -F 'event.respondWith(networkFirst(event.request))' site/sw.js
          if grep -Fq 'lokySeismicGlobe' site/mobile-seismic.js; then echo 'Legacy globe must be deleted'; exit 1; fi
          if grep -Fq 'function drawGlobe(' site/mobile-seismic.js; then echo 'Legacy draw loop must be deleted'; exit 1; fi
          grep -F '.loky-seismic-mode .sphere-wrap{display:none!important}' site/mobile-seismic.js
          grep -F 'const ACTIVE_FPS=60' site/mobile-earth-reference.js
          grep -F 'const IDLE_FPS=24' site/mobile-earth-reference.js
          grep -F 'async function buildDotsAsync(' site/mobile-earth-reference.js
          grep -F "const DEVICE_KEY='loky_pc4_device_capability_v1'" site/mobile-settings-plus.js
          grep -F 'loky-pc4-mobile-devices' site/mobile-settings-plus.js
          grep -F '04f46c6a0708418cb7b96fc563eacae0fbf77674' site/mobile-settings-plus.js
          grep -F 'loky-settings-dashboard' site/mobile-settings-plus.js
          grep -F 'ADMINISTRAR DISPOSITIVOS' site/mobile-settings-plus.js
          grep -F "api('claim_device'" site/mobile-settings-plus.js
          grep -F 'CÓDIGO DE ACCESO' site/mobile-settings-plus.js
          grep -F 'function renderDevicesScreen(' site/mobile-settings-plus.js
          if grep -Fq 'function accordion(' site/mobile-settings-plus.js; then exit 1; fi
          if grep -R -E -q 'getUserMedia\s*\(|new\s+WebSocket\s*\(|LOKY_PC4_LIVE' site/mobile-seismic.js site/mobile-earth-reference.js site/mobile-settings-plus.js; then exit 1; fi

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sphere-mobile.js
          node --check site/app.js
          node --check site/live-mobile.js
          node --check site/ios-audio-stability.js
          node --check site/mobile-features.js
          node --check site/mobile-settings-plus.js
          node --check site/mobile-noise-guard.js
          node --check site/mobile-seismic.js
          node --check site/mobile-earth-reference.js
          node --check site/sw.js
          node --check .github/scripts/build-earth-geometry-r4f6.cjs

      - name: Verify iOS 0.3.2R4 PC4 conversation port remains frozen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const BUILD='0.3.2'" site/app.js
          grep -F "phase:'gemini-live-native'" site/app.js
          grep -F '"version": "0.3.2"' site/version.json
          grep -F "const VERSION='0.3.2R4-pc4-conversation-port'" site/live-mobile.js
          grep -F 'const END_SILENCE_MS=420' site/live-mobile.js
          grep -F 'automaticActivityDetection:{disabled:true}' site/live-mobile.js
          grep -F "sendRealtime(ws,{activityStart:{}})" site/live-mobile.js
          grep -F "sendRealtime(ws,{activityEnd:{}})" site/live-mobile.js
          grep -F "prebuiltVoiceConfig:{voiceName:'Kore'}" site/live-mobile.js
          grep -F 'contextWindowCompression:{slidingWindow:{}}' site/live-mobile.js
          grep -F "navigator.audioSession.type=type" site/ios-audio-stability.js
          grep -F "await ctx.suspend()" site/ios-audio-stability.js
          grep -F "await ctx.resume()" site/ios-audio-stability.js
          if grep -Fq 'interimInputTranscription' site/live-mobile.js; then exit 1; fi

      - name: Run frozen conversation Earth and Devices tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs
          node .github/tests/ios032r4f2r1-noise-guard.test.cjs
          node .github/tests/ios032r4f6-seismic-instant-update-delivery.test.cjs
          node .github/tests/ios032r4f5-devices-qr.test.cjs
          node .github/tests/ios032r4f5r3-settings-dashboard.test.cjs
          node .github/tests/ios032r4f5r4-guest-handoff.test.cjs

      - name: Verify Natural Earth USGS and device backends
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson'
          curl -fsS "$BASE/ne_50m_land.geojson" -o /tmp/land.json
          curl -fsS "$BASE/ne_110m_admin_0_countries.geojson" -o /tmp/countries.json
          node -e "for(const p of ['/tmp/land.json','/tmp/countries.json']){const x=require(p);if(x.type!=='FeatureCollection'||!Array.isArray(x.features)||x.features.length<20)process.exit(2)}"
          curl -fsS 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson' -o /tmp/quakes.json
          node -e "const x=require('/tmp/quakes.json'); if(x.type!=='FeatureCollection'||!Array.isArray(x.features)||!x.metadata) process.exit(2);"
          DEV='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-devices'
          TOKEN='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$DEV" -o /tmp/device-health.json
          node -e "const x=require('/tmp/device-health.json'); if(!x.ok||x.version!==2||x.guestActivation!=='handoff-code-v1') process.exit(2)"
          curl -fsS "$TOKEN" -o /tmp/token-health.json
          node -e "const x=require('/tmp/token-health.json'); if(!x.ok||x.auth!=='owner-or-invited-device-capability'||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2)"
          code=$(curl -sS -o /tmp/device-denied.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-loky-device: invalid-device-123456789' --data '{"action":"status"}' "$DEV")
          test "$code" = '401'
          code=$(curl -sS -o /tmp/token-denied.json -w '%{http_code}' -X POST -H 'x-loky-device: invalid-device-123456789' "$TOKEN")
          test "$code" = '401'
          curl -fsS 'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js' -o /tmp/qrcode.min.js
          grep -F 'QRCode' /tmp/qrcode.min.js >/dev/null

      - name: Verify no forbidden fallback or secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -q 'AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY|x-goog-api-key|GN8M-9PCC-EQV6-XK4A' site; then echo 'Secret/API key material must never be present in public Mobile files'; exit 1; fi
          if grep -R -E -qi 'QWEN|FALLBACK LOCAL|speechSynthesis' site; then echo 'Local robotic voice fallback is forbidden in native Live build'; exit 1; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
