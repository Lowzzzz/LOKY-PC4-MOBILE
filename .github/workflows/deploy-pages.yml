name: Deploy LOKY PC4 Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact frozen app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cat deploy/icon180.part00 deploy/icon180.part01 deploy/icon180.part02 | tr -d '\r\n ' | base64 --decode > site/icons/icon-180.png
          cat deploy/icon512.part00 deploy/icon512.part01 deploy/icon512.part02 deploy/icon512.part03 deploy/icon512.part04a deploy/icon512.fix00 deploy/icon512.fix01 deploy/icon512.fix02 deploy/icon512.fix03 | tr -d '\r\n ' | base64 --decode > site/icons/icon-512.png

      - name: Build R4F6 precompiled Earth geometry
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/build-earth-geometry-r4f6.cjs
          node .github/scripts/build-earth-geometry-r4f6.cjs
          node -e "const x=require('./site/earth-geometry-r4f6.json'); if(x.version!=='r4f6-precompiled-v1'||x.naturalEarthCommit!=='ca96624a56bd078437bca8184e78163e5039ad19'||!Array.isArray(x.landRings)||x.landRings.length<20||!Array.isArray(x.countryRings)||x.countryRings.length<20||!Array.isArray(x.dots)||x.dots.length<1500||x.dots.length>9800) process.exit(2)"

      - name: Build R4F7R2 static voice previews
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-voice-preview'
          mkdir -p site/voice-previews
          curl --retry 2 --retry-delay 1 -fsS "$PREVIEW?warm=1" -o /tmp/preview-warm.json
          node -e "const x=require('/tmp/preview-warm.json'); if(!x.ok||x.version!==3||x.model!=='gemini-3.1-flash-tts-preview'||x.staticPreview!=='pcm-get-v1'||x.warm?.ready!==8||x.warm?.total!==8) process.exit(2)"
          for voice in Kore Achird Sulafat Charon Puck Gacrux Aoede Umbriel; do
            curl --retry 2 --retry-delay 1 -fsS "$PREVIEW?voice=$voice" -o "site/voice-previews/$voice.pcm"
            test "$(stat -c%s "site/voice-previews/$voice.pcm")" -gt 20000
          done

      - name: Verify protected visual assets and authorized R4F10R3R1 sphere
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../PROTECTED_0_1_VISUAL_SHA256.txt

      - name: Verify frozen conversation and protected runtime byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "f28a58275661f8513e9e3b29911c62f51e04bd28"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "9550b79c231527cc4e659f15ce35a8d3bb973380"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "f7314f4e0dab972697059337b838becd11f8c5f8"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          test "$(git rev-parse HEAD:site/mobile-noise-guard.js)" = "c632c64738c0bb34d7e372d28a5532d238b23398"

      - name: Verify R4F6R2 Earth coastline and R4F5 Devices runtime exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/index.html)" = "27473a56b3797909c4bcd745db0232cd74d0f6f6"
          test "$(git rev-parse HEAD:site/mobile-seismic.js)" = "6acbdcad502f1313a5af5ae2d675ba23340d38d9"
          test "$(git rev-parse HEAD:site/mobile-earth-reference.js)" = "e09bc1c27548fc520229e856de22139107ed0ab1"
          test "$(git rev-parse HEAD:site/mobile-settings-plus.js)" = "82723f1c591ce5c7137098edb0431778622d5fa5"
          test "$(git rev-parse HEAD:site/sw.js)" = "17a9b05710f48efcf5325c81016450324ab94884"
          if test -e site/mobile-continent-detail.js; then exit 1; fi
          grep -F '<script src="./mobile-settings-plus.js?v=0.3.2r4f5"></script>' site/index.html
          grep -F '<script src="./mobile-planner.js?v=0.3.2r4f8"></script>' site/index.html
          grep -F '<script src="./mobile-background-alarm.js?v=0.3.2r4f9"></script>' site/index.html
          grep -F '<script src="./mobile-web-search.js?v=0.3.2r4f10r3"></script>' site/index.html
          grep -F '<script src="./mobile-earth-reference.js?v=0.3.2r4f6"></script>' site/index.html
          grep -F "const VERSION='0.3.2R4F7R3-personality-audio-preview'" site/mobile-settings-plus.js
          grep -F "const VERSION='0.3.2R4F4R1-seismic-controller'" site/mobile-seismic.js
          grep -F "const VERSION='0.3.2R4F6R2-earth-coast-persistence'" site/mobile-earth-reference.js
          grep -F "const PRECOMPILED_URL='./earth-geometry-r4f6.json'" site/mobile-earth-reference.js
          grep -F 'function scheduleWarmGeometry(' site/mobile-earth-reference.js
          grep -F 'scheduleWarmGeometry();' site/mobile-earth-reference.js
          grep -F "const VERSION='loky-pc4-mobile-ios-0.3.2-r4f9r1'" site/sw.js
          grep -F 'mobile-settings-plus\.js' site/sw.js
          grep -F 'mobile-background-alarm\.js' site/sw.js
          grep -F 'mobile-seismic\.js' site/sw.js
          grep -F 'mobile-earth-reference\.js' site/sw.js
          grep -F 'earth-geometry-r4f6\.json' site/sw.js
          grep -F 'event.respondWith(networkFirst(event.request))' site/sw.js
          if grep -Fq 'lokySeismicGlobe' site/mobile-seismic.js; then echo 'Legacy globe must be deleted'; exit 1; fi
          if grep -Fq 'function drawGlobe(' site/mobile-seismic.js; then echo 'Legacy draw loop must be deleted'; exit 1; fi
          grep -F '.loky-seismic-mode .sphere-wrap{display:none!important}' site/mobile-seismic.js
          grep -F 'const ACTIVE_FPS=60' site/mobile-earth-reference.js
          grep -F 'const IDLE_FPS=24' site/mobile-earth-reference.js
          grep -F 'const FAST_DOT_STRIDE=1' site/mobile-earth-reference.js
          if grep -Fq 'const FAST_DOT_STRIDE=4' site/mobile-earth-reference.js; then exit 1; fi
          grep -F 'coastStep=1' site/mobile-earth-reference.js
          if grep -Fq 'coastStep=fast?4:1' site/mobile-earth-reference.js; then exit 1; fi
          grep -F 'async function buildDotsAsync(' site/mobile-earth-reference.js
          grep -F "const DEVICE_KEY='loky_pc4_device_capability_v1'" site/mobile-settings-plus.js
          grep -F 'loky-pc4-mobile-devices' site/mobile-settings-plus.js
          grep -F '04f46c6a0708418cb7b96fc563eacae0fbf77674' site/mobile-settings-plus.js
          grep -F 'loky-settings-dashboard' site/mobile-settings-plus.js
          grep -F 'ADMINISTRAR DISPOSITIVOS' site/mobile-settings-plus.js
          grep -F "api('claim_device'" site/mobile-settings-plus.js
          grep -F 'CÓDIGO DE ACCESO' site/mobile-settings-plus.js
          grep -F 'function showProfileModal(' site/mobile-settings-plus.js
          grep -F 'features.settings.setVoice' site/mobile-settings-plus.js
          grep -F 'features.settings.setPersonality' site/mobile-settings-plus.js
          grep -F 'VOICE_PREVIEW_ENDPOINT' site/mobile-settings-plus.js
          grep -F "const VOICE_PREVIEW_STATIC_BASE='./voice-previews'" site/mobile-settings-plus.js
          grep -F "const VOICE_PREVIEW_STATIC_VERSION='0.3.2r4f7r2'" site/mobile-settings-plus.js
          grep -F 'function preloadVoicePreviews(' site/mobile-settings-plus.js
          grep -F 'function playVoicePreview(' site/mobile-settings-plus.js
          grep -F 'function preloadPersonalityPreviews(' site/mobile-settings-plus.js
          grep -F 'async function playPersonalityPreview(' site/mobile-settings-plus.js
          grep -F "body:JSON.stringify({action:'personality',voiceName,personality})" site/mobile-settings-plus.js
          grep -F '{previewPersonality:true}' site/mobile-settings-plus.js
          grep -F "const select=make('button','loky-choice-select','SELECCIONAR')" site/mobile-settings-plus.js
          grep -F 'setter(draft)' site/mobile-settings-plus.js
          if grep -Fq 'setter(key)' site/mobile-settings-plus.js; then exit 1; fi
          grep -F 'function renderDevicesScreen(' site/mobile-settings-plus.js
          if grep -Fq 'function accordion(' site/mobile-settings-plus.js; then exit 1; fi
          if grep -R -E -q 'getUserMedia\s*\(|new\s+WebSocket\s*\(|LOKY_PC4_LIVE' site/mobile-seismic.js site/mobile-earth-reference.js site/mobile-settings-plus.js; then exit 1; fi

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sphere-mobile.js
          node --check site/app.js
          node --check site/live-mobile.js
          node --check site/ios-audio-stability.js
          node --check site/mobile-features.js
          node --check site/mobile-settings-plus.js
          node --check site/mobile-planner.js
          node --check site/mobile-background-alarm.js
          node --check site/mobile-web-search.js
          node --check site/mobile-actions.js
          node --check site/mobile-language-tutor.js
          node --check site/mobile-noise-guard.js
          node --check site/mobile-seismic.js
          node --check site/mobile-earth-reference.js
          node --check site/sw.js
          node --check .github/scripts/build-earth-geometry-r4f6.cjs

      - name: Verify R4F7R3 personality audio preview and profile layer
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const VERSION='0.3.2R4F7-voice-personality-profiles'" site/mobile-features.js
          grep -F 'const VOICE_PROFILES={' site/mobile-features.js
          grep -F 'const PERSONALITIES={' site/mobile-features.js
          grep -F "name:'Kore'" site/mobile-features.js
          grep -F "name:'Achird'" site/mobile-features.js
          grep -F "name:'Sulafat'" site/mobile-features.js
          grep -F "name:'Charon'" site/mobile-features.js
          grep -F "name:'Puck'" site/mobile-features.js
          grep -F "name:'Gacrux'" site/mobile-features.js
          grep -F "name:'Aoede'" site/mobile-features.js
          grep -F "name:'Umbriel'" site/mobile-features.js
          grep -F 'prebuiltVoiceConfig={voiceName}' site/mobile-features.js
          grep -F 'personalityInstruction=settings.personalityInstruction()' site/mobile-features.js
          grep -F 'if(parsed?.setup&&!resumeHandle)' site/mobile-features.js
          if grep -Fq 'getUserMedia(' site/mobile-settings-plus.js; then exit 1; fi
          if grep -Fq 'new WebSocket(' site/mobile-settings-plus.js; then exit 1; fi

      - name: Verify R4F8 planner isolated layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/mobile-planner.js)" = "ffc8a6035276a085460807dba396927aa44ed1cc"
          grep -F "const VERSION='0.3.2R4F8R5-instant-alarm-capture'" site/mobile-planner.js
          grep -F "const STORE_KEY='loky_pc4_mobile_planner_v1'" site/mobile-planner.js
          grep -F 'function parseVoiceCommand(' site/mobile-planner.js
          grep -F 'function openPlannerPanel(' site/mobile-planner.js
          grep -F "String(conversationState.textContent||'').trim()==='PENSANDO'" site/mobile-planner.js
          grep -F 'Notification.requestPermission()' site/mobile-planner.js
          grep -F 'navigator.serviceWorker?.ready' site/mobile-planner.js
          grep -F "const ALERT_SOUND_KEY='loky_pc4_mobile_alert_sounds_v1'" site/mobile-planner.js
          grep -F 'const ALERT_SOUNDS={' site/mobile-planner.js
          grep -F 'function playAlertSoundById(' site/mobile-planner.js
          grep -F 'function showSoundSelector(' site/mobile-planner.js
          grep -F 'startDueAlertSound(item.type)' site/mobile-planner.js
          grep -F 'SONIDO DE ALERTA' site/mobile-planner.js
          grep -F 'SELECCIONAR' site/mobile-planner.js
          grep -F 'height:calc(54px + var(--safe-top))' site/mobile-planner.js
          grep -F 'padding:var(--safe-top) 12px 0' site/mobile-planner.js
          grep -F 'function deviceTimeZone(' site/mobile-planner.js
          grep -F 'function fmtDeviceClock(' site/mobile-planner.js
          grep -F 'function nextPlannerTime(' site/mobile-planner.js
          grep -F 'HORA LOCAL DEL DISPOSITIVO' site/mobile-planner.js
          grep -F 'when.value=toLocalInput(nextPlannerTime())' site/mobile-planner.js
          grep -F 'const WEEKDAY_INDEX={' site/mobile-planner.js
          grep -F 'function startDueAlertSound(' site/mobile-planner.js
          grep -F 'DETENER ALARMA' site/mobile-planner.js
          grep -F 'DETENER SONIDO' site/mobile-planner.js
          grep -F 'Number.POSITIVE_INFINITY' site/mobile-planner.js
          grep -F 'startDueAlertSound(item.type)' site/mobile-planner.js
          grep -F 'activeAlertSoundTimer' site/mobile-planner.js
          grep -F 'despiertame' site/mobile-planner.js
          grep -F 'function spokenNumber(' site/mobile-planner.js
          grep -F 'const alarmIntent=' site/mobile-planner.js
          grep -F 'const calendarIntent=' site/mobile-planner.js
          grep -F 'dentro' site/mobile-planner.js
          grep -F 'agendes' site/mobile-planner.js
          grep -F 'function instantAlarmReady(' site/mobile-planner.js
          grep -F 'function scheduleInstantAlarmCapture(' site/mobile-planner.js
          grep -F 'new MutationObserver(scheduleInstantAlarmCapture)' site/mobile-planner.js
          grep -F '},220);' site/mobile-planner.js
          grep -F 'lastInstantAlarm={' site/mobile-planner.js
          grep -F 'if(existing)return true;' site/mobile-planner.js
          if grep -Fq 'Date.now()+60*60*1000' site/mobile-planner.js; then exit 1; fi
          grep -F "['RECORDATORIOS','Avisos y tareas pendientes','R']" site/mobile-features.js
          grep -F "['CALENDARIO','Eventos y agenda','C']" site/mobile-features.js
          grep -F "['ALARMAS','Alarmas y temporizadores','A']" site/mobile-features.js
          if grep -E -q 'new[[:space:]]+WebSocket|getUserMedia[[:space:]]*\(|LOKY_PC4_LIVE' site/mobile-planner.js; then exit 1; fi

      - name: Verify R4F9 cloud background alarm isolated layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/mobile-planner.js)" = "ffc8a6035276a085460807dba396927aa44ed1cc"
          test "$(git rev-parse HEAD:site/mobile-background-alarm.js)" = "b1f9a26e73511d6e3229305f371507ab80a6d539"
          test "$(git rev-parse HEAD:site/index.html)" = "27473a56b3797909c4bcd745db0232cd74d0f6f6"
          test "$(git rev-parse HEAD:site/sw.js)" = "17a9b05710f48efcf5325c81016450324ab94884"
          grep -F "const VERSION='0.3.2R4F9-cloud-background-alarms'" site/mobile-background-alarm.js
          grep -F "const ENDPOINT='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-push'" site/mobile-background-alarm.js
          grep -F "const DEVICE_KEY='loky_pc4_device_capability_v1'" site/mobile-background-alarm.js
          grep -F 'pushManager.subscribe({' site/mobile-background-alarm.js
          grep -F 'userVisibleOnly:true' site/mobile-background-alarm.js
          grep -F "await api('schedule_alarm'" site/mobile-background-alarm.js
          grep -F "await api('cancel_alarm'" site/mobile-background-alarm.js
          grep -F "await api('test_push',{})" site/mobile-background-alarm.js
          grep -F 'ALARMA CON LOKY CERRADA · ACTIVAR' site/mobile-background-alarm.js
          grep -F 'const SYNC_MS=500' site/mobile-background-alarm.js
          grep -F "self.addEventListener('push'" site/sw.js
          grep -F 'silent:false' site/sw.js
          grep -F "self.addEventListener('notificationclick'" site/sw.js
          grep -F 'new URL(target,self.registration.scope).href' site/sw.js
          if grep -E -q 'new[[:space:]]+WebSocket|getUserMedia[[:space:]]*\(|LOKY_PC4_LIVE|speechSynthesis' site/mobile-background-alarm.js; then exit 1; fi

      - name: Verify R4F10R3R1 turn-safe web search and stronger reactive sphere layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "f28a58275661f8513e9e3b29911c62f51e04bd28"
          test "$(git rev-parse HEAD:site/mobile-planner.js)" = "ffc8a6035276a085460807dba396927aa44ed1cc"
          test "$(git rev-parse HEAD:site/mobile-background-alarm.js)" = "b1f9a26e73511d6e3229305f371507ab80a6d539"
          test "$(git rev-parse HEAD:site/sw.js)" = "17a9b05710f48efcf5325c81016450324ab94884"
          test "$(git rev-parse HEAD:site/mobile-web-search.js)" = "be2dfce56a7af5e1abbb4f2277a635ac16c03c38"
          test "$(git rev-parse HEAD:site/index.html)" = "27473a56b3797909c4bcd745db0232cd74d0f6f6"
          grep -F "const VERSION='0.3.2R4F10R3-turn-safe-search'" site/mobile-web-search.js
          grep -F "const ENDPOINT='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-search'" site/mobile-web-search.js
          grep -F "const DEVICE_KEY='loky_pc4_device_capability_v1'" site/mobile-web-search.js
          grep -F 'window.LOKY_PC4_LIVE' site/mobile-web-search.js
          grep -F 'state?.activeWs' site/mobile-web-search.js
          grep -F 'clientContent:{' site/mobile-web-search.js
          grep -F "role:'user'" site/mobile-web-search.js
          grep -F 'turnComplete:true' site/mobile-web-search.js
          if grep -Fq 'function announceLiveSearch(' site/mobile-web-search.js; then exit 1; fi
          if grep -Fq 'Estoy buscando eso ahora' site/mobile-web-search.js; then exit 1; fi
          grep -F 'const TURN_END_POLL_MS=90' site/mobile-web-search.js
          grep -F 'const TURN_SETTLE_MS=180' site/mobile-web-search.js
          grep -F 'if(liveState?.userSpeaking)' site/mobile-web-search.js
          grep -F 'if(window.LOKY_PC4_LIVE?.state?.userSpeaking)' site/mobile-web-search.js
          if grep -Fq 'turnComplete:false' site/mobile-web-search.js; then exit 1; fi
          if grep -Fq 'function holdLiveSearch(' site/mobile-web-search.js; then exit 1; fi
          grep -F 'Estado de acceso Web de LOKY: ACTIVO.' site/mobile-web-search.js
          grep -F 'NO digas que no tienes acceso a Internet' site/mobile-web-search.js
          grep -F 'function finishLiveSearchError(' site/mobile-web-search.js
          grep -F 'WEB EN TIEMPO REAL · VERIFICADO' site/mobile-web-search.js
          grep -F 'FUENTES' site/mobile-web-search.js
          grep -F "const VERSION='0.3.2R4F10R3R1-stronger-distortion'" site/sphere-mobile.js
          grep -F 'live?.userSpeaking' site/sphere-mobile.js
          grep -F 'live?.playing?.size' site/sphere-mobile.js
          grep -F "label==='LOKY HABLANDO'" site/sphere-mobile.js
          grep -F "label==='PENSANDO'" site/sphere-mobile.js
          grep -F 'uniform float uMotion;' site/sphere-mobile.js
          grep -F 'uniform float uState;' site/sphere-mobile.js
          grep -F '<script src="./sphere-mobile.js?v=0.3.2r4f10r3r1"></script>' site/index.html
          grep -F '<script src="./live-mobile.js?v=0.3.2r4f10r3"></script>' site/index.html
          if grep -E -q 'new[[:space:]]+WebSocket|getUserMedia[[:space:]]*\(|speechSynthesis|navigator\.geolocation' site/mobile-web-search.js; then exit 1; fi
          if grep -E -q 'new[[:space:]]+WebSocket|getUserMedia[[:space:]]*\(|fetch[[:space:]]*\(' site/sphere-mobile.js; then exit 1; fi

      - name: Verify R4F11R6 timer delete layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "f28a58275661f8513e9e3b29911c62f51e04bd28"
          test "$(git rev-parse HEAD:site/mobile-web-search.js)" = "be2dfce56a7af5e1abbb4f2277a635ac16c03c38"
          test "$(git rev-parse HEAD:site/mobile-planner.js)" = "ffc8a6035276a085460807dba396927aa44ed1cc"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "f7314f4e0dab972697059337b838becd11f8c5f8"
          test "$(git rev-parse HEAD:site/mobile-actions.js)" = "5803be78d341cbeff06a7e45f608bc80c51193c8"
          test "$(git rev-parse HEAD:site/index.html)" = "27473a56b3797909c4bcd745db0232cd74d0f6f6"
          grep -F "const VERSION='0.3.2R4F11R6-timer-delete'" site/mobile-actions.js
          grep -F 'new MutationObserver(scheduleFromTranscript)' site/mobile-actions.js
          grep -F 'state?.transcriptBuffer' site/mobile-actions.js
          grep -F 'function commandCandidates(' site/mobile-actions.js
          grep -F 'startPoll();' site/mobile-actions.js
          grep -F 'const POLL_MS=90' site/mobile-actions.js
          grep -F 'const TRANSCRIPT_SETTLE_MS=360' site/mobile-actions.js
          grep -F 'location.href=url' site/mobile-actions.js
          grep -F 'if(live?.userSpeaking)' site/mobile-actions.js
          grep -F 'function showTimerPopup(' site/mobile-actions.js
          grep -F "card.className='loky-timer-popup'" site/mobile-actions.js
          grep -F 'top:calc(10px + env(safe-area-inset-top))' site/mobile-actions.js
          if grep -Fq 'timerPopupTimeout=setTimeout(clearTimerPopup,5200)' site/mobile-actions.js; then exit 1; fi
          grep -F 'if(remaining<=0)' site/mobile-actions.js
          grep -F "state.textContent='FINALIZADO'" site/mobile-actions.js
          grep -F 'timerPopupTimeout=setTimeout(clearTimerPopup,1400)' site/mobile-actions.js
          grep -F "type:'timer-delete'" site/mobile-actions.js
          grep -F 'function cancelTimer(' site/mobile-actions.js
          grep -F 'planner.remove(timer.id)' site/mobile-actions.js
          grep -F 'LOKY_PC4_BACKGROUND_ALARM?.sync?.(true)' site/mobile-actions.js
          grep -F "'TEMPORIZADOR ELIMINADO'" site/mobile-actions.js
          grep -F "'TEMPORIZADORES ELIMINADOS'" site/mobile-actions.js
          grep -F 'showTimerPopup(action.ms)' site/mobile-actions.js
          if grep -Fq 'future-op-1' site/mobile-actions.js; then exit 1; fi
          if grep -Fq 'openActionsMenu' site/mobile-actions.js; then exit 1; fi
          grep -F 'window.LOKY_PC4_PLANNER' site/mobile-actions.js
          grep -F 'window.LOKY_PC4_FEATURES' site/mobile-actions.js
