name: Deploy LOKY PC4 Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact frozen app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cat deploy/icon180.part00 deploy/icon180.part01 deploy/icon180.part02 | tr -d '\r\n ' | base64 --decode > site/icons/icon-180.png
          cat deploy/icon512.part00 deploy/icon512.part01 deploy/icon512.part02 deploy/icon512.part03 deploy/icon512.part04a deploy/icon512.fix00 deploy/icon512.fix01 deploy/icon512.fix02 deploy/icon512.fix03 | tr -d '\r\n ' | base64 --decode > site/icons/icon-512.png

      - name: Verify frozen iOS 0.1 visual core
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../PROTECTED_0_1_VISUAL_SHA256.txt

      - name: Verify frozen R4 conversation and protected runtime are byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"

      - name: Verify frozen R4F2R1 R4F3R2 and isolated continent overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "a9c02db6ffcf8efcb76d8e1bc35ca5439240a81f"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          test "$(git rev-parse HEAD:site/mobile-noise-guard.js)" = "c632c64738c0bb34d7e372d28a5532d238b23398"
          test "$(git rev-parse HEAD:site/mobile-seismic.js)" = "4616876813ba0c990d0dc9eb131f3d553c204d29"
          test "$(git rev-parse HEAD:site/mobile-continent-detail.js)" = "00e182760e023c8a8d57a27e642a3f2c77032494"
          test "$(git rev-parse HEAD:site/index.html)" = "123249e328c120f97be02a94238b8b76efa652ec"
          grep -F '<script src="./mobile-features.js?v=0.3.2r4f1"></script>' site/index.html
          grep -F '<script src="./mobile-noise-guard.js?v=0.3.2r4f2r1"></script>' site/index.html
          grep -F '<script src="./mobile-seismic.js?v=0.3.2r4f3"></script>' site/index.html
          grep -F '<script src="./mobile-continent-detail.js?v=0.3.2r4f3r3"></script>' site/index.html
          grep -F "const VERSION='0.3.2R4F2-settings-memory-windows'" site/mobile-features.js
          grep -F "const VERSION='0.3.2R4F2R1-voice-noise-guard'" site/mobile-noise-guard.js
          grep -F "const VERSION='0.3.2R4F3R2-earth-ultra-quake-info'" site/mobile-seismic.js
          grep -F "const VERSION='0.3.2R4F3R3-continent-detail'" site/mobile-continent-detail.js
          grep -F 'function selectQuake(' site/mobile-seismic.js
          grep -F 'function pickQuake(' site/mobile-seismic.js
          grep -F 'PROFUNDIDAD' site/mobile-seismic.js
          grep -F "pointerEvents:'none'" site/mobile-continent-detail.js
          grep -F 'seismic.project(' site/mobile-continent-detail.js
          grep -F "['NORTEAMÉRICA'" site/mobile-continent-detail.js
          grep -F "['SUDAMÉRICA'" site/mobile-continent-detail.js
          grep -F "['EUROPA'" site/mobile-continent-detail.js
          grep -F "['ÁFRICA'" site/mobile-continent-detail.js
          grep -F "['ASIA'" site/mobile-continent-detail.js
          grep -F "['OCEANÍA'" site/mobile-continent-detail.js
          if grep -Eq 'getUserMedia\s*\(|new\s+WebSocket\s*\(|LOKY_PC4_LIVE|fetch\s*\(' site/mobile-continent-detail.js; then exit 1; fi

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/sphere-mobile.js
          node --check site/app.js
          node --check site/live-mobile.js
          node --check site/ios-audio-stability.js
          node --check site/mobile-features.js
          node --check site/mobile-noise-guard.js
          node --check site/mobile-seismic.js
          node --check site/mobile-continent-detail.js
          node --check site/sw.js

      - name: Verify iOS 0.3.2R4 PC4 conversation port remains frozen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const BUILD='0.3.2'" site/app.js
          grep -F "phase:'gemini-live-native'" site/app.js
          grep -F '"version": "0.3.2"' site/version.json
          grep -F "const VERSION='0.3.2R4-pc4-conversation-port'" site/live-mobile.js
          grep -F 'const END_SILENCE_MS=420' site/live-mobile.js
          grep -F 'automaticActivityDetection:{disabled:true}' site/live-mobile.js
          grep -F "sendRealtime(ws,{activityStart:{}})" site/live-mobile.js
          grep -F "sendRealtime(ws,{activityEnd:{}})" site/live-mobile.js
          grep -F "prebuiltVoiceConfig:{voiceName:'Kore'}" site/live-mobile.js
          grep -F 'contextWindowCompression:{slidingWindow:{}}' site/live-mobile.js
          grep -F "navigator.audioSession.type=type" site/ios-audio-stability.js
          grep -F "await ctx.suspend()" site/ios-audio-stability.js
          grep -F "await ctx.resume()" site/ios-audio-stability.js
          if grep -Fq 'interimInputTranscription' site/live-mobile.js; then exit 1; fi

      - name: Run frozen conversation Sismos and continent tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs
          node .github/tests/ios032r4f2r1-noise-guard.test.cjs
          node .github/tests/ios032r4f3-sismos-globe.test.cjs
          node .github/tests/ios032r4f3r3-continent-detail.test.cjs

      - name: Verify USGS realtime earthquake feed
        shell: bash
        run: |
          set -euo pipefail
          URL='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson'
          curl -fsS "$URL" -o /tmp/quakes.json
          node -e "const x=require('/tmp/quakes.json'); if(x.type!=='FeatureCollection'||!Array.isArray(x.features)||!x.metadata) process.exit(2);"

      - name: Verify no forbidden fallback or secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -q 'AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY|x-goog-api-key|GN8M-9PCC-EQV6-XK4A' site; then
            echo 'Secret/API key material must never be present in public Mobile files'
            exit 1
          fi
          if grep -R -E -qi 'QWEN|FALLBACK LOCAL|speechSynthesis' site; then
            echo 'Local robotic voice fallback is forbidden in native Live build'
            exit 1
          fi

      - name: Verify secure token backend health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/loky-health.json
          node -e "const x=require('/tmp/loky-health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
          code=$(curl -sS -o /tmp/loky-denied.json -w '%{http_code}' -X POST -H 'x-loky-device: invalid-device' "$URL")
          test "$code" = '401'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
