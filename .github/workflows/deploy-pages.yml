name: Deploy LOKY PC4 Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact frozen app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/icons
          cat deploy/icon180.part00 deploy/icon180.part01 deploy/icon180.part02 | tr -d '\r\n ' | base64 --decode > site/icons/icon-180.png
          cat deploy/icon512.part00 deploy/icon512.part01 deploy/icon512.part02 deploy/icon512.part03 deploy/icon512.part04a deploy/icon512.fix00 deploy/icon512.fix01 deploy/icon512.fix02 deploy/icon512.fix03 | tr -d '\r\n ' | base64 --decode > site/icons/icon-512.png

      - name: Verify frozen iOS 0.1 visual core
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../PROTECTED_0_1_VISUAL_SHA256.txt

      - name: Verify iOS 0.2.0 release byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cd site
          sha256sum -c ../RELEASE_SHA256.txt

      - name: Verify UI shell scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const BUILD='0.2.0'" site/app.js
          grep -F "phase:'ui-shell'" site/app.js
          grep -F '"version": "0.2.0"' site/version.json
          if grep -E -q 'getUserMedia|new WebSocket|AIza[0-9A-Za-z_-]{20,}' site/app.js site/index.html; then
            echo 'Unexpected voice/network secret surface in UI shell'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
