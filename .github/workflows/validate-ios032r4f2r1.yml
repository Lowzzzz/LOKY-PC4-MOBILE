name: Validate iOS 0.3.2R4F2R1 Voice Noise Guard

on:
  push:
    branches: [candidate/ios-0.3.2R4F2R1-voice-noise-guard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated runtime scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=487826848bb1bc52e57d369dbf1099b3be36de04
          changed="$(git diff --name-only "$BASE"..HEAD | grep -v '^\.github/' || true)"
          printf '%s\n' "$changed"
          test "$changed" = $'site/index.html\nsite/mobile-noise-guard.js'

      - name: Verify frozen core and R4F2 features are byte-exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:site/live-mobile.js)" = "af201c91e1db634ef62cd6505696a602e293bc83"
          test "$(git rev-parse HEAD:site/sphere-mobile.js)" = "f99882addf9a263ae8c41f12f111b9f03b5ed73d"
          test "$(git rev-parse HEAD:site/ios-audio-stability.js)" = "d8254b160719a647fc07164a96f3955d8b268bfd"
          test "$(git rev-parse HEAD:site/app.js)" = "1f635fdda78933dda2fa0b66d3c4bef41768ffc7"
          test "$(git rev-parse HEAD:site/sw.js)" = "f65be5534df529c8f3e409b6a5e1ca6f29967725"
          test "$(git rev-parse HEAD:site/mobile-features.js)" = "a9c02db6ffcf8efcb76d8e1bc35ca5439240a81f"
          test "$(git rev-parse HEAD:site/mobile.css)" = "b4eff4577685dce6b07867cc040d4b8369be2a51"
          git show 487826848bb1bc52e57d369dbf1099b3be36de04:site/index.html > /tmp/base-index.html
          grep -v 'mobile-noise-guard.js' site/index.html > /tmp/current-without-guard.html
          cmp /tmp/base-index.html /tmp/current-without-guard.html

      - name: Verify noise guard contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/mobile-noise-guard.js
          grep -F "const VERSION='0.3.2R4F2R1-voice-noise-guard'" site/mobile-noise-guard.js
          grep -F 'PITCH_CORR_MIN=0.18' site/mobile-noise-guard.js
          grep -F 'state.startFrames=0' site/mobile-noise-guard.js
          grep -F 'state.startFrames=Math.max' site/mobile-noise-guard.js
          grep -F '__lokyVoiceNoiseGuard' site/mobile-noise-guard.js
          grep -F '<script src="./mobile-noise-guard.js?v=0.3.2r4f2r1"></script>' site/index.html

      - name: Run noise guard tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4f2r1-noise-guard.test.cjs

      - name: Re-run frozen feature and conversation tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/tests/ios032r4-pc4-conversation-port.test.cjs
          node .github/tests/ios032r4f2-settings-memory-windows.test.cjs

      - name: Verify secure Gemini token backend
        shell: bash
        run: |
          set -euo pipefail
          URL='https://novgwydgcvlboujnmygq.supabase.co/functions/v1/loky-pc4-mobile-token'
          curl -fsS "$URL" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.geminiConfigured||x.model!=='models/gemini-3.8-live'||x.tokenSchema!=='unconstrained-ephemeral-v1beta') process.exit(2);"
